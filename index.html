<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: рисуем под «чёлкой» и полоской Home, отступы берём из safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111114" />
    <!-- Для iOS: запуск с экрана «Домой» на весь экран, без интерфейса Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eukairo" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Eukairo</title>
    <style>
      /* Фон задан прямо в HTML, чтобы при запуске не мигал белый экран до загрузки CSS */
      html, body { background: #111114; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
